    /* Define reusable colour variables so the palette can be changed in one place. */
    :root {
      --burgundy: #a74760;      /* Main burgundy-rose colour for headings and accents. */
      --rose: #d16a83;           /* Brighter rose used in gradients and highlights. */
      --olive: #899064;          /* Muted olive green for secondary accents. */
      --olive-dark: #c0c79a;     /* Lighter olive for readable text on dark backgrounds. */
      --blush: #39252e;           /* Deep, pink-tinted surface colour for navigation links. */
      --background: #171316;      /* Main near-black background with a warm undertone. */
      --panel: #21191e;           /* Slightly lighter colour for the main content panel. */
      --ink: #f7edf0;             /* Soft off-white text colour for strong contrast. */
      --muted: #c1adb4;           /* Softer text colour for paragraphs and secondary details. */
      --line: #54333e;             /* Subtle burgundy border colour. */
    }

    /* Include padding and borders inside each element's declared width and height. */
    * {
      box-sizing: border-box;
    }

    /* Style the full page and place the footer below the main content. */
    body {
      margin: 0; /* Remove the browser's default outer margin. */
      min-height: 100vh; /* Make the page at least as tall as the browser window. */
      font-family: "Segoe UI", Arial, sans-serif; /* Use a clean, widely available sans-serif font. */
      color: var(--ink); /* Set the default text colour. */
      background:
        radial-gradient(ellipse at 12% 12%, rgba(167, 71, 96, .22), transparent 38%), /* Add a subtle burgundy glow in the top-left. */
        radial-gradient(ellipse at 88% 88%, rgba(137, 144, 100, .16), transparent 40%), /* Add a subtle olive glow in the bottom-right. */
        linear-gradient(135deg, #171316 0%, #21181e 52%, #1b1e17 100%); /* Blend the dark base colours together. */
      display: flex; /* Use flexbox to arrange the header, main section and footer vertically. */
      flex-direction: column; /* Stack the page sections from top to bottom. */
    }

    /* Keep the header aligned with the main content and space its items apart. */
    header {

      
      width: min(1100px, 100%); /* Limit the header width while allowing it to shrink on small screens. */
      margin: 0 auto; /* Centre the header horizontally. */
      padding: 28px; /* Add space around the header content. */
      display: flex; /* Place the brand and note on one row. */
      align-items: center; /* Align header items vertically. */
      justify-content: space-between; /* Push the brand and note to opposite sides. */
      gap: 18px; /* Leave space between header items if they wrap. */


      
    }

    /* Style the site name as a compact, letter-spaced wordmark. */
    .brand {
      color: var(--rose); /* Use the brighter rose colour for the brand. */
      font-size: .88rem; /* Keep the wordmark smaller than the main heading. */
      font-weight: 800; /* Make the wordmark bold. */
      letter-spacing: .16em; /* Spread the letters for a polished feel. */
      text-transform: uppercase; /* Display the brand in uppercase. */
      text-decoration: none; /* Remove the default link underline. */
    }

    /* Make the small header note less prominent than the brand. */
    .header-note {
      color: var(--muted); /* Use muted text for secondary information. */
      font-size: .9rem; /* Keep the note compact. */
    }

    /* Centre the main content and let it fill the space between header and footer. */
    main {
      width: min(1000px, 100%); /* Prevent the content from becoming too wide. */
      margin: auto; /* Centre the main section horizontally and use available vertical space. */
      padding: 54px 28px 72px; /* Add breathing room around the main panel. */
      flex: 1; /* Allow the main section to grow and push the footer down. */
      display: block; /* Use block to position the hero panel. */
      
    }

    /* Create the main content panel with straighter edges and restrained depth. */
    .hero {
      width: 100%; /* Let the panel use the available main-section width. */
      padding: clamp(32px, 7vw, 76px) clamp(20px, 5vw, 64px); /* Scale panel padding to the screen size. */
      text-align: center; /* Centre the welcome text and navigation. */
      border: 1px solid var(--line); /* Outline the panel with a subtle burgundy border. */
      border-radius: 8px; /* Use a small radius for a sharper, less button-like look. */
      background: linear-gradient(145deg, rgba(39, 27, 33, .96), rgba(29, 27, 25, .96)); /* Give the panel a very subtle dark gradient. */
      box-shadow: 0 22px 55px rgba(0, 0, 0, .28); /* Add depth without a bright or heavy glow. */
    }

    /* Style the small uppercase label above the main heading. */
    .eyebrow {
      margin: 0 0 18px; /* Separate the label from the heading below it. */
      color: var(--olive-dark); /* Use a pale olive accent for contrast on the dark panel. */
      font-size: .78rem; /* Keep the label small. */
      font-weight: 800; /* Make the label stand out. */
      letter-spacing: .2em; /* Spread out the label's letters. */
      text-transform: uppercase; /* Use uppercase for the label. */
    }

    /* Give the main heading an editorial serif style. */
    h1 {
      margin: 0; /* Remove default heading margins so spacing is controlled explicitly. */
      color: #f1b2c0; /* Use a soft rosy pink for the main heading. */
      font-family: Georgia, "Times New Roman", serif; /* Contrast the heading with the sans-serif body text. */
      font-size: clamp(2.7rem, 7vw, 5.1rem); /* Scale the heading across mobile and desktop. */
      font-weight: 500; /* Keep the heading elegant rather than overly heavy. */
      line-height: 1.05; /* Keep multi-line heading lines close together. */
      letter-spacing: -.045em; /* Slightly tighten the heading letters. */
    }

    /* Set a comfortable reading width and line spacing for the introduction. */
    .intro {
      max-width: 590px; /* Prevent paragraphs from stretching across the whole panel. */
      margin: 22px auto 0; /* Add space above and centre the paragraph. */
      color: var(--muted); /* Use muted text to keep the heading as the focal point. */
      font-size: clamp(1rem, 2vw, 1.12rem); /* Adjust text size slightly for different screens. */
      line-height: 1.8; /* Make the paragraph easy to read. */
    }

    /* Add a short gradient divider between the heading and body copy. */
    .accent-line {
      width: 66px; /* Set the divider's width. */
      height: 3px; /* Keep the divider slim and understated. */
      margin: 28px auto; /* Centre the divider and add vertical space around it. */
      border-radius: 2px; /* Soften only the divider's tiny corners. */
      background: linear-gradient(90deg, var(--rose), #e6a9b6, var(--olive)); /* Blend rose, blush and olive. */
    }

    /* Arrange the five navigation links in one row on wider screens. */
    .nav-grid {
      display: grid; /* Use CSS Grid for consistent navigation columns. */
      grid-template-columns: repeat(5, minmax(0, 1fr)); /* Create five equal-width columns. */
      gap: 12px; /* Add space between the links. */
      margin-top: 34px; /* Separate the links from the introduction. */
    }

    /* Make each navigation link feel like a flat, refined menu item rather than a pill button. */
    .nav-button {
      display: flex; /* Centre the label within each link. */
      min-height: 58px; /* Keep links large enough to click comfortably. */
      align-items: center; /* Centre link text vertically. */
      justify-content: center; /* Centre link text horizontally. */
      padding: 14px 12px; /* Add internal space around the label. */
      border: 1px solid #62404a; /* Outline each link with a muted burgundy border. */
      border-radius: 4px; /* Use nearly square corners for a sharper appearance. */
      background: linear-gradient(135deg, #38242d, #2b2528); /* Give the link a subtle dark burgundy gradient. */
      color: #f3c6d0; /* Use pale pink for link text. */
      font-size: .95rem; /* Keep link labels easy to read. */
      font-weight: 700; /* Make the link labels clear. */
      text-decoration: none; /* Remove the default underline. */
      box-shadow: 0 4px 12px rgba(0, 0, 0, .12); /* Add a very subtle shadow beneath each link. */
      transition: transform .2s ease, border-color .2s ease, background .2s ease; /* Animate hover changes smoothly. */
    }

    /* Give a navigation link a small lift and brighter outline when hovered. */
    .nav-button:hover {
      transform: translateY(-3px); /* Raise the link slightly on hover. */
      border-color: var(--rose); /* Highlight its border in rose. */
      background: linear-gradient(135deg, #4a2935, #343629); /* Shift the background toward burgundy and olive. */
    }

    /* Show a clear keyboard focus outline for accessibility. */
    .nav-button:focus-visible,
    .back-link:focus-visible {
      outline: 2px solid var(--olive-dark); /* Make keyboard focus visible. */
      outline-offset: 3px; /* Keep the outline slightly away from the element border. */
    }

    /* Style the return link on placeholder pages. */
    .back-link {
      display: inline-flex; /* Let the link size itself to its contents. */
      align-items: center; /* Centre the link label vertically. */
      justify-content: center; /* Centre the link label horizontally. */
      margin-top: 30px; /* Add space above the return link. */
      padding: 12px 20px; /* Give the link a comfortable clickable area. */
      border: 1px solid var(--rose); /* Use a rose outline instead of a filled pill. */
      border-radius: 4px; /* Keep the corners sharp and consistent with the navigation. */
      background: linear-gradient(120deg, #482532, #30272a); /* Use a subtle dark gradient. */
      color: #f5c6d1; /* Make the label readable against the dark background. */
      font-weight: 700; /* Emphasise the link label. */
      text-decoration: none; /* Remove the standard underline. */
      transition: transform .2s ease, border-color .2s ease; /* Smoothly animate hover effects. */
    }

    /* Add a restrained hover effect to the return link. */
    .back-link:hover {
      transform: translateY(-2px); /* Raise the link slightly. */
      border-color: var(--olive-dark); /* Change the outline to olive. */
    }

    /* Keep the footer small and visually secondary. */
    footer {
      padding: 20px 24px 26px; /* Add space around the footer text. */
      color: var(--muted); /* Use muted text so it doesn't compete with the page. */
      font-size: .82rem; /* Make the footer text smaller than body text. */
      text-align: center; /* Centre the footer message. */
    }

    /* Reflow the layout for tablets and mobile phones. */
    @media (max-width: 720px) {
      header {
        padding: 22px 20px; /* Reduce header padding on narrow screens. */
      }

      .header-note {
        display: none; /* Hide the secondary note to save horizontal space. */
      }

      main {
        padding: 34px 18px 48px; /* Reduce main spacing on narrow screens. */
      }

      .nav-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr)); /* Display navigation links in two columns. */
      }

      .nav-button:last-child {
        grid-column: 1 / -1; /* Let the fifth link span both columns. */
      }
    }

    /* Reduce animation for visitors who prefer less motion in their system settings. */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        transition-duration: .01ms !important; /* Make transitions effectively instant. */
      }
    }
    
    /* ==========================================
       EXPERIENCE SECTION — STACKED OBLONG CARDS
       ========================================== */

    /* Give the Experience section space above and below it. */
    .experience-section {
      margin-top: clamp(0.25rem, 1vw, 0,75rem);;
      padding: 30px 0 70px;
      scroll-margin-top: 30px;
    }

    /* Centre the Experience heading above the stack. */
    .experience-heading {
      margin: 0 0 14px;
      color: var(--pink);
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(2.4rem, 5vw, 4rem);
      font-weight: 500;
      letter-spacing: -.035em;
      text-align: center;
    }

    /* Add a short gradient accent underneath the heading. */
    .experience-heading-line {
      width: 76px;
      height: 3px;
      margin: 0 auto 42px;
      background: linear-gradient(90deg, var(--rose), #e6a9b6, var(--olive));
    }

    /* Keep the stack centred and narrower than the full page. */
    .experience-list {
      display: flex;
      flex-direction: column;
      gap: 20px;
      width: min(820px, 100%);
      margin: 0 auto;
    }

    /* Style each experience as a clickable horizontal oblong. */
    .experience-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      width: 100%;
      min-height: 92px;
      padding: 22px 30px;
      border: 1px solid rgba(209, 106, 131, .45);
      border-radius: 999px;
      background:
        linear-gradient(110deg, rgba(72, 37, 50, .94), rgba(37, 34, 33, .96));
      color: var(--ink);
      text-align: left;
      cursor: pointer;
      box-shadow:
        0 0 24px rgba(209, 106, 131, .08),
        inset 0 0 18px rgba(209, 106, 131, .025);
      transition:
        opacity .45s ease,
        transform .45s ease,
        border-color .25s ease,
        box-shadow .25s ease,
        background .25s ease;
    }

    /* Brighten and lift the oblong when a visitor points at it. */
    .experience-card:hover {
      transform: translateY(-3px);
      border-color: var(--pink);
      background:
        linear-gradient(110deg, rgba(91, 43, 60, .98), rgba(43, 42, 34, .98));
      box-shadow:
        0 0 30px rgba(209, 106, 131, .18),
        0 0 14px rgba(137, 144, 100, .08);
    }

    /* Make keyboard focus as visible as mouse hover. */
    .experience-card:focus-visible {
      outline: 2px solid var(--olive-light);
      outline-offset: 5px;
    }

    /* Keep the experience title and its small label together. */
    .experience-card-copy {
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    /* Make the dummy job or activity title easy to scan. */
    .experience-title {
      color: var(--pink);
      font-size: clamp(1rem, 2vw, 1.2rem);
      font-weight: 750;
      line-height: 1.3;
    }

    /* Use olive for the smaller invitation to open the card. */
    .experience-hint {
      color: var(--olive-light);
      font-size: .82rem;
      letter-spacing: .025em;
    }

    /* Add a small arrow at the right side of each oblong. */
    .experience-arrow {
      flex: 0 0 auto;
      color: var(--olive-light);
      font-size: 1.5rem;
      transition: transform .25s ease, color .25s ease;
    }

    /* Nudge the arrow right on hover to hint that the card opens. */
    .experience-card:hover .experience-arrow {
      color: var(--pink);
      transform: translateX(4px);
    }

    /* Cards begin slightly lower and transparent before entering view. */
    .experience-card.reveal-on-scroll {
      opacity: 0;
      transform: translateY(28px);
    }

    /* JavaScript adds this class when a card enters the viewport. */
    .experience-card.reveal-on-scroll.is-visible {
      opacity: 1;
      transform: translateY(0);
    }

    /* Fade cards out again when they leave the viewport. */
    .experience-card.reveal-on-scroll:not(.is-visible) {
      opacity: 0;
      transform: translateY(18px);
    }

    /* ==========================================
       EXPERIENCE DESCRIPTION POP-UP
       ========================================== */

    /* Cover the page with a dark, blurred overlay when a card opens. */
    .experience-modal-backdrop {
      position: fixed;
      z-index: 1000;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background: rgba(10, 8, 10, .76);
      -webkit-backdrop-filter: blur(9px);
      backdrop-filter: blur(9px);
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition: opacity .3s ease, visibility .3s ease;
    }

    /* Reveal the backdrop when the pop-up is active. */
    .experience-modal-backdrop.is-open {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
    }

    /* Keep the description panel centred and smaller than the screen. */
    .experience-modal {
      position: relative;
      width: min(620px, 100%);
      max-height: min(78vh, 680px);
      overflow-y: auto;
      padding: clamp(30px, 6vw, 52px);
      border: 1px solid rgba(209, 106, 131, .65);
      border-radius: 18px;
      background:
        radial-gradient(ellipse at 12% 0%, rgba(167, 71, 96, .22), transparent 55%),
        linear-gradient(145deg, #2a1d24, #1c1b18);
      box-shadow:
        0 0 55px rgba(209, 106, 131, .19),
        0 24px 80px rgba(0, 0, 0, .45);
      transform: translateY(16px) scale(.985);
      transition: transform .3s ease;
    }

    /* Bring the panel gently into place when it opens. */
    .experience-modal-backdrop.is-open .experience-modal {
      transform: translateY(0) scale(1);
    }

    /* Position the close button in the panel's top-right corner. */
    .experience-modal-close {
      position: absolute;
      top: 12px;
      right: 16px;
      display: grid;
      place-items: center;
      width: 38px;
      height: 38px;
      padding: 0;
      border: 1px solid rgba(209, 106, 131, .4);
      border-radius: 50%;
      background: rgba(23, 19, 22, .7);
      color: var(--pink);
      font-size: 1.6rem;
      line-height: 1;
      cursor: pointer;
      transition: background .2s ease, transform .2s ease;
    }

    /* Give the close button clear hover feedback. */
    .experience-modal-close:hover {
      background: rgba(167, 71, 96, .35);
      transform: rotate(90deg);
    }

    /* Keep the close button accessible when navigating with a keyboard. */
    .experience-modal-close:focus-visible {
      outline: 2px solid var(--olive-light);
      outline-offset: 3px;
    }

    /* Style the small label above the selected experience title. */
    .experience-modal-kicker {
      margin: 0 0 14px;
      color: var(--olive-light);
      font-size: .76rem;
      font-weight: 800;
      letter-spacing: .2em;
      text-transform: uppercase;
    }

    /* Give the selected experience title a clear focal point. */
    .experience-modal-title {
      margin: 0 36px 22px 0;
      color: var(--pink);
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(1.8rem, 4vw, 2.6rem);
      font-weight: 500;
      line-height: 1.15;
    }

    /* Make the experience summary comfortable to read. */
    .experience-modal-description {
      margin: 0;
      color: var(--muted);
      font-size: 1rem;
      line-height: 1.85;
      white-space: pre-line;
    }

    /* Stop the background page from scrolling while the panel is open. */
    body.experience-modal-open {
      overflow: hidden;
    }

    /* On small screens, make the cards less wide-looking and the panel compact. */
    @media (max-width: 520px) {
      .experience-section {
        margin-top: 76px;
        padding-bottom: 45px;
      }

      .experience-heading-line {
        margin-bottom: 30px;
      }

      .experience-list {
        gap: 14px;
      }

      .experience-card {
        min-height: 82px;
        padding: 18px 22px;
        border-radius: 28px;
      }

      .experience-modal-backdrop {
        padding: 16px;
      }

      .experience-modal {
        max-height: 82vh;
        padding: 34px 24px;
        border-radius: 14px;
      }
    }

    /* Keep the pop-up and card animations subtle for reduced-motion users. */
    @media (prefers-reduced-motion: reduce) {
      .experience-card,
      .experience-modal-backdrop,
      .experience-modal,
      .experience-arrow,
      .experience-modal-close {
        transition: none;
      }
    }
  </style>
</head>

    <div
      class="experience-modal-backdrop"
      id="experience-modal-backdrop"
      aria-hidden="true">

      <!-- The dialog is a separate, smaller panel centred over the dimmed page. -->
      <section
        class="experience-modal"
        id="experience-modal"
        role="dialog"
        aria-modal="true"
        aria-labelledby="experience-modal-title"
        aria-describedby="experience-modal-description">

        <!-- Close button in the upper-right corner of the description panel. -->

          class="experience-modal-close"
          id="experience-modal-close"
          type="button"
          aria-label="Close experience description">
          &times;
        </button>

        <!-- Small label above the selected experience title. -->
        <p class="experience-modal-kicker">Experience</p>

        <!-- JavaScript fills this heading with the selected card's title. -->
        <h3 class="experience-modal-title" id="experience-modal-title">Experience title</h3>

  <!-- Keep the same footer on every page. -->

 <script>
 
 // ==========================================
    // EXPERIENCE CARDS: FADE IN AND OUT ON SCROLL
    // ==========================================

    // Select all five clickable experience cards.
    const experienceCards = document.querySelectorAll('.experience-card');

    // Check whether the browser supports observing elements as they scroll.
    if ('IntersectionObserver' in window) {

      // Watch cards as they enter and leave the visible part of the page.
      const experienceObserver = new IntersectionObserver(function (entries) {

        // Process each card whose visibility has changed.
        entries.forEach(function (entry) {

          // Add the visible class when a card enters the viewport.
          if (entry.isIntersecting) {
            entry.target.classList.add('is-visible');
          } else {

            // Remove the class when the card leaves the viewport,
            // allowing it to fade out and fade in again on re-entry.
            entry.target.classList.remove('is-visible');
          }
        });

      }, {
        threshold: 0.12, // Trigger when roughly 12% of a card is visible.
        rootMargin: '0px 0px -35px 0px' // Start the effect slightly inside the viewport.
      });

      // Start observing every experience card.
      experienceCards.forEach(function (card) {
        experienceObserver.observe(card);
      });

    } else {

      // Fallback for older browsers: show every card without scroll effects.
      experienceCards.forEach(function (card) {
        card.classList.add('is-visible');
      });
    }


    // ==========================================
    // EXPERIENCE DESCRIPTION POP-UP
    // ==========================================

    // Find the reusable background overlay and description panel.
    const modalBackdrop = document.getElementById('experience-modal-backdrop');
    const modal = document.getElementById('experience-modal');

    // Find the title, description and close button inside the panel.
    const modalTitle = document.getElementById('experience-modal-title');
    const modalDescription = document.getElementById('experience-modal-description');
    const modalCloseButton = document.getElementById('experience-modal-close');

    // Remember which card opened the panel so keyboard focus can return to it.
    let previouslyFocusedCard = null;

    // Open the description panel for the selected experience.
    function openExperience(card) {

      // Remember the clicked card for when the panel closes.
      previouslyFocusedCard = card;

      // Read the title and description directly from the clicked card.
      modalTitle.textContent = card.dataset.title;
      modalDescription.textContent = card.dataset.description;

      // Reveal the dimmed and blurred background overlay.
      modalBackdrop.classList.add('is-open');

      // Tell assistive technology that the overlay is now visible.
      modalBackdrop.setAttribute('aria-hidden', 'false');

      // Prevent the page behind the panel from scrolling.
      document.body.classList.add('experience-modal-open');

      // Move keyboard focus to the close button for accessibility.
      modalCloseButton.focus();
    }

    // Close the panel and return the visitor to the experience stack.
    function closeExperience() {

      // Do nothing if the panel is already closed.
      if (!modalBackdrop.classList.contains('is-open')) {
        return;
      }

      // Hide the overlay and start its fade-out transition.
      modalBackdrop.classList.remove('is-open');

      // Mark the hidden overlay as unavailable to assistive technology.
      modalBackdrop.setAttribute('aria-hidden', 'true');

      // Restore scrolling on the page.
      document.body.classList.remove('experience-modal-open');

      // Return keyboard focus to the card that opened the panel.
      if (previouslyFocusedCard) {
        previouslyFocusedCard.focus();
      }
    }

    // Open the matching description whenever an experience card is clicked.
    experienceCards.forEach(function (card) {
      card.addEventListener('click', function () {
        openExperience(card);
      });
    });

    // Close the panel when the visitor clicks the X button.
    modalCloseButton.addEventListener('click', closeExperience);

    // Also close the panel when the visitor clicks the dimmed area outside it.
    modalBackdrop.addEventListener('click', function (event) {

      // Only close when the backdrop itself was clicked, not the panel.
      if (event.target === modalBackdrop) {
        closeExperience();
      }
    });

    // Allow Escape to close the description panel.
    document.addEventListener('keydown', function (event) {

      // Only respond to Escape while the panel is open.
      if (
        event.key === 'Escape' &&
        modalBackdrop.classList.contains('is-open')
      ) {
        closeExperience();
      }
    });
  </script>
